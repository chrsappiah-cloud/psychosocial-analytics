name: PsychosocialAnalytics
options:
  bundleIdPrefix: wcs.Psychosocial--Analytics
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  PsychosocialAnalytics:
    path: "."

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "TM2WG7HH96"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES
      COPY_PHASE_STRIP: YES

targets:
  PsychosocialAnalyticsApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    productName: PsychosocialAnalytics
    sources:
      - path: App/PsychosocialAnalyticsApp
        excludes:
          - "**/*.xcprivacy"
    resources:
      - App/PsychosocialAnalyticsApp/Assets.xcassets
      - App/PsychosocialAnalyticsApp/PrivacyInfo.xcprivacy
    info:
      path: App/PsychosocialAnalyticsApp/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Psychosocial Analytics
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: PsychosocialAnalytics
        product: PsychosocialAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wcs.Psychosocial--Analytics
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Psychosocial Analytics
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SWIFT_STRICT_CONCURRENCY: complete

  PsychosocialAnalyticsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PsychosocialAnalyticsTests
    dependencies:
      - package: PsychosocialAnalytics
        product: PsychosocialAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wcs.Psychosocial--Analytics.tests
        GENERATE_INFOPLIST_FILE: YES

  PsychosocialAnalyticsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests/PsychosocialAnalyticsUITests
    dependencies:
      - target: PsychosocialAnalyticsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wcs.Psychosocial--Analytics.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PsychosocialAnalytics:
    build:
      targets:
        PsychosocialAnalyticsApp: all
        PsychosocialAnalyticsTests: [test]
        PsychosocialAnalyticsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PsychosocialAnalyticsTests
        - PsychosocialAnalyticsUITests
      gatherCoverageData: true
    archive:
      config: Release
