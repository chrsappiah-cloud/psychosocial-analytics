name: Build & Push Backend Image (GHCR)

# Manual-only. Builds the FastAPI backend Docker image and pushes it to
# ghcr.io/<owner>/psychosocial-analytics-backend.
#
# Authentication uses the built-in GITHUB_TOKEN (no extra secrets needed).
# To deploy the image to a hosting provider (Fly/Render/Cloud Run/etc.) add a
# follow-up workflow that consumes the published tag below.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (defaults to git short sha)'
        required: false
        default: ''
  push:
    tags:
      - 'backend-v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/psychosocial-analytics-backend
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
