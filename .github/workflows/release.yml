name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  validate-release:
    name: Validate release build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Release build
        run: |
          xcodebuild build \
            -scheme PsychosocialAnalytics \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Full unit test suite
        run: |
          xcodebuild test \
            -scheme PsychosocialAnalytics \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -only-testing:PsychosocialAnalyticsTests \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive distribution materials
        uses: actions/upload-artifact@v4
        with:
          name: app-store-submission-pack
          path: |
            Distribution/
            DISTRIBUTION.md
            CONFIGURATION.md
            App/PsychosocialAnalyticsApp/ExportOptions.plist
