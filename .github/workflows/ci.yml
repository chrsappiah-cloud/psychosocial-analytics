name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: iOS Build & Test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package
        run: xcodebuild -resolvePackageDependencies -scheme PsychosocialAnalytics

      - name: List simulators
        run: xcrun simctl list devices available | head -30

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme PsychosocialAnalytics \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          DEST=$(xcrun simctl list devices available | grep -E "iPhone (16|17)" | grep -v "unavailable" | head -1 | sed -E 's/.*\(([-A-F0-9]+)\).*/\1/')
          if [ -z "$DEST" ]; then
            xcodebuild test \
              -scheme PsychosocialAnalytics \
              -destination 'generic/platform=iOS Simulator' \
              -only-testing:PsychosocialAnalyticsTests \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild test \
              -scheme PsychosocialAnalytics \
              -destination "platform=iOS Simulator,id=$DEST" \
              -only-testing:PsychosocialAnalyticsTests \
              -configuration Debug \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore

  lint-project:
    name: Project integrity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify required distribution files
        run: |
          test -f Distribution/AppStoreConnect/metadata.json
          test -f App/PsychosocialAnalyticsApp/PrivacyInfo.xcprivacy
          test -f App/PsychosocialAnalyticsApp/Info.plist
          test -f project.yml
          echo "Distribution and project files present."
