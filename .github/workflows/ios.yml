name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Build (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: "Psychosocial  Analytics"
      PROJECT: "Psychosocial  Analytics.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphonesimulator || true
          ls /Applications | grep -i xcode || true

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
