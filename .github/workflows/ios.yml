name: iOS Build

on:
  push:
    branches: [main]
    paths:
      - 'Psychosocial  Analytics/**'
      - 'Psychosocial  Analytics.xcodeproj/**'
      - 'Psychosocial  AnalyticsTests/**'
      - 'Psychosocial  AnalyticsUITests/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Psychosocial  Analytics/**'
      - 'Psychosocial  Analytics.xcodeproj/**'
      - 'Psychosocial  AnalyticsTests/**'
      - 'Psychosocial  AnalyticsUITests/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: iOS Build (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SCHEME: "Psychosocial  Analytics"
      PROJECT: "Psychosocial  Analytics.xcodeproj"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode + SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphonesimulator || true
          ls /Applications | grep -i xcode || true

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort | tail -1)/Contents/Developer"
          xcodebuild -version

      - name: Resolve build destination
        id: destination
        run: |
          DEST=$(xcrun simctl list devices available | awk '/iPhone 1[5-9] Pro/ && /\(Shutdown\)/ {match($0,/\(([0-9A-F-]+)\)/,a); if(a[1]){print a[1]; exit}}')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available | awk '/iPhone/ && /\(Shutdown\)/ {match($0,/\(([0-9A-F-]+)\)/,a); if(a[1]){print a[1]; exit}}')
          fi
          echo "Using simulator UDID: $DEST"
          echo "udid=$DEST" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=${{ steps.destination.outputs.udid }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
